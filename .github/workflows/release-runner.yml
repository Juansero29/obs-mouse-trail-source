name: Release Runner

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to release (example: v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute-release:
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
